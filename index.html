<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea tu Mixtape</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Courier+Prime:wght@400;700&family=Inter:wght@400;700&family=Outfit:wght@300;400;600;800&family=Permanent+Marker&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #e5e7eb; /* Color de respaldo */
        }

        .spin { animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .font-handwriting { font-family: 'Permanent Marker', cursive; }
        .font-typewriter { font-family: 'Courier Prime', monospace; }
        .font-standard { font-family: 'Inter', sans-serif; font-weight: 700; }
        .font-cursive { font-family: 'Caveat', cursive; font-size: 1.4em; }
        .font-pixel { font-family: 'VT323', monospace; font-size: 1.3em; letter-spacing: 1px; }

        .label-solid { background-color: white; }
        .label-striped { background: repeating-linear-gradient(0deg, white, white 19px, #e5e7eb 20px); }
        .label-grid {
            background-color: white;
            background-image: linear-gradient(#e5e7eb 1px, transparent 1px), linear-gradient(90deg, #e5e7eb 1px, transparent 1px);
            background-size: 15px 15px;
        }
        .label-sunset { background: linear-gradient(135deg, #fde047, #f9a8d4, #c084fc); }
        .label-transparent { 
            background-color: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(4px); 
            border: 1px solid rgba(255, 255, 255, 0.6) !important; 
        }

        .screw {
            width: 12px; height: 12px;
            background: linear-gradient(135deg, #d1d5db, #9ca3af);
            border-radius: 50%;
            border: 1px solid #4b5563;
            position: absolute;
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.5), inset -1px -1px 2px rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            z-index: 50;
        }
        .screw::after { content: ''; width: 8px; height: 1px; background: #374151; transform: rotate(45deg); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-8 text-neutral-800 relative">

    <!-- CAPA DE FONDO FIJA (Solución definitiva para celulares) -->
    <img src="assets/textura.jpg" class="fixed inset-0 w-full h-full object-cover -z-10 pointer-events-none opacity-90" alt="Fondo" onerror="this.style.display='none'">

    <!-- Contenedor Principal -->
    <div class="max-w-6xl w-full bg-white/40 backdrop-blur-md border border-white/50 sm:rounded-3xl shadow-2xl flex flex-col lg:flex-row-reverse min-h-[700px] relative">
        
        <!-- PANEL DERECHO: CASETE (Sticky en móvil) -->
        <div class="w-full lg:w-1/2 py-6 px-4 sm:p-8 flex flex-col items-center justify-center sticky top-0 z-50 bg-white/50 backdrop-blur-xl lg:bg-transparent lg:backdrop-blur-none border-b border-white/50 lg:border-none sm:rounded-t-3xl lg:rounded-tr-3xl lg:rounded-br-3xl lg:rounded-tl-none self-start shadow-sm lg:shadow-none transition-all">
            <div class="z-10 text-center w-full max-w-[450px]">
                
                <!-- CASETE REALISTA -->
                <div id="cassetteBody" class="w-full aspect-[16/10] bg-[#Facc15] rounded-xl border-2 border-neutral-800 shadow-[inset_0px_0px_25px_rgba(0,0,0,0.5),_10px_15px_25px_rgba(0,0,0,0.4)] flex items-center justify-center relative overflow-hidden transition-colors duration-500">
                    
                    <div class="absolute inset-0 bg-gradient-to-br from-white/30 via-transparent to-black/40 pointer-events-none z-40 mix-blend-overlay rounded-xl"></div>
                    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-white/20 via-transparent to-transparent pointer-events-none z-40"></div>

                    <div class="screw top-3 left-3"></div>
                    <div class="screw top-3 right-3"></div>
                    <div class="screw bottom-3 left-3"></div>
                    <div class="screw bottom-3 right-3"></div>
                    
                    <div class="absolute inset-2 border-2 border-black/15 rounded-lg pointer-events-none z-10"></div>

                    <div id="cassetteLabel" class="absolute top-5 w-[88%] h-[58%] label-solid border border-neutral-400/80 rounded shadow-sm flex flex-col items-center justify-start p-2 sm:p-3 z-20 transition-all duration-300">
                        <div class="w-full border-b-2 border-red-500 pb-1 mb-1 flex justify-between items-center px-1">
                            <span class="text-[9px] sm:text-[11px] font-bold text-neutral-600 tracking-wider">60 MIN</span>
                            <span id="labelPreview" class="font-handwriting text-neutral-900 text-xl sm:text-2xl leading-tight text-center flex-grow truncate px-2 transition-all">Mixtape</span>
                            <span class="text-[9px] sm:text-[11px] font-bold text-neutral-600 tracking-wider">LADO A</span>
                        </div>
                    </div>
                    
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-3/4 h-20 sm:h-24 bg-black/15 backdrop-blur-[2px] rounded-lg border border-black/25 z-30 flex items-center justify-between px-4 sm:px-6 shadow-[inset_0_4px_10px_rgba(0,0,0,0.2)]">
                        
                        <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full border-[5px] sm:border-[6px] border-neutral-200 bg-[#f8f9fa] flex items-center justify-center relative shadow-[0_0_8px_rgba(0,0,0,0.6)]">
                            <svg class="absolute w-full h-full spin text-neutral-800 opacity-90" viewBox="0 0 100 100" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                <path d="M50 15 L60 40 L85 50 L60 60 L50 85 L40 60 L15 50 L40 40 Z"/>
                            </svg>
                            <div class="w-3 h-3 sm:w-4 sm:h-4 bg-neutral-800 rounded-full z-10 shadow-inner"></div>
                        </div>
                        
                        <div class="w-28 sm:w-36 h-10 sm:h-12 bg-neutral-900 rounded-md flex items-center justify-center shadow-[inset_0_0_10px_rgba(0,0,0,1)] relative overflow-hidden border border-neutral-700/50">
                            <div class="absolute left-[-20px] w-20 h-20 bg-[#1a1a1a] rounded-full shadow-[0_0_5px_black]"></div>
                            <div class="absolute right-[-20px] w-16 h-16 bg-[#1a1a1a] rounded-full shadow-[0_0_5px_black]"></div>
                            <div class="w-20 sm:w-24 h-[2px] bg-neutral-500/30 rounded z-10"></div>
                        </div>
                        
                        <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full border-[5px] sm:border-[6px] border-neutral-200 bg-[#f8f9fa] flex items-center justify-center relative shadow-[0_0_8px_rgba(0,0,0,0.6)]">
                            <svg class="absolute w-full h-full spin text-neutral-800 opacity-90" viewBox="0 0 100 100" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                <path d="M50 15 L60 40 L85 50 L60 60 L50 85 L40 60 L15 50 L40 40 Z"/>
                            </svg>
                            <div class="w-3 h-3 sm:w-4 sm:h-4 bg-neutral-800 rounded-full z-10 shadow-inner"></div>
                        </div>
                    </div>

                    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-4/5 h-10 sm:h-12 bg-black/10 border-t-2 border-black/15 rounded-t-lg flex justify-center items-end pb-2 gap-4 sm:gap-6 opacity-90 shadow-[inset_0_4px_10px_rgba(0,0,0,0.1)] z-10">
                        <div class="w-3 h-3 bg-black/40 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.6)]"></div>
                        <div class="w-4 h-4 bg-black/40 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.6)]"></div>
                        <div class="w-3 h-3 bg-black/40 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.6)]"></div>
                        <div class="w-4 h-4 bg-black/40 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.6)]"></div>
                        <div class="w-3 h-3 bg-black/40 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.6)]"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PANEL IZQUIERDO: CONFIGURADOR -->
        <div class="w-full lg:w-1/2 p-6 md:p-10 bg-white/60 lg:border-r border-white/40 sm:rounded-b-3xl lg:rounded-bl-3xl lg:rounded-tl-3xl lg:rounded-br-none">
            <h1 class="text-4xl sm:text-5xl font-extrabold text-neutral-900 mb-2 tracking-tight mt-2 lg:mt-0">Tu Mixtape</h1>
            <p class="text-neutral-600 mb-8 font-medium">Diseña el casete y añade hasta 4 canciones de YouTube.</p>
            
            <div id="successZone" class="hidden bg-green-50/90 backdrop-blur border border-green-200 rounded-xl p-6 text-center shadow-lg">
                <h3 class="text-green-800 font-bold mb-2 text-xl">¡Cinta grabada con éxito! 📼</h3>
                <p class="text-sm text-green-700 mb-4">Envía este enlace a esa persona especial:</p>
                <input type="text" id="linkOutput" readonly class="w-full border border-green-300 rounded-lg p-3 text-center text-sm mb-4 outline-none bg-white font-semibold shadow-inner text-neutral-600">
                <button onclick="copyLink()" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition shadow-md">Copiar Enlace</button>
                
                <div id="playerContainer" class="mt-6 rounded-xl overflow-hidden shadow-lg border border-neutral-200 bg-black">
                    <iframe id="ytIframe" width="100%" height="220" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>

                <button onclick="resetForm()" class="block w-full mt-5 text-sm text-neutral-500 hover:text-neutral-800 underline transition">Crear otra cinta</button>
            </div>

            <div id="formZone" class="space-y-7">
                
                <div class="space-y-4 bg-white/60 backdrop-blur-sm p-5 rounded-2xl border border-white/80 shadow-sm">
                    <h3 class="font-bold text-neutral-900 border-b border-neutral-200/60 pb-2">1. Textos y Dedicatoria</h3>
                    <div>
                        <label class="block text-xs font-bold text-neutral-500 uppercase tracking-wider mb-1">Título de la cinta</label>
                        <input type="text" id="titulo" onkeyup="updatePreview()" placeholder="Ej. Mix para el viaje" class="w-full border border-neutral-300/80 rounded-xl p-3 outline-none focus:ring-2 focus:ring-black bg-white/90 transition" maxlength="25">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-neutral-500 uppercase tracking-wider mb-1">Nota oculta</label>
                        <textarea id="mensaje" placeholder="Escribe un mensaje para cuando abran el casete..." rows="2" class="w-full border border-neutral-300/80 rounded-xl p-3 outline-none focus:ring-2 focus:ring-black bg-white/90 transition resize-none"></textarea>
                    </div>
                </div>

                <div class="space-y-4 bg-white/60 backdrop-blur-sm p-5 rounded-2xl border border-white/80 shadow-sm">
                    <div class="flex justify-between items-end border-b border-neutral-200/60 pb-2">
                        <h3 class="font-bold text-neutral-900">2. Canciones</h3>
                        <span id="songCount" class="text-xs font-bold bg-neutral-200 px-2 py-1 rounded-full">0/4</span>
                    </div>
                    <div class="flex gap-2">
                        <input type="url" id="songInput" placeholder="Pega el link de YouTube aquí..." class="w-full border border-neutral-300/80 rounded-xl p-3 outline-none focus:ring-2 focus:ring-black bg-white/90 transition">
                        <button id="addBtn" onclick="addSong()" class="bg-black text-white px-5 rounded-xl font-bold hover:bg-neutral-800 transition min-w-[70px]">Add</button>
                    </div>
                    <ul id="songList" class="space-y-2 mt-2">
                    </ul>
                </div>

                <div class="space-y-4 bg-white/60 backdrop-blur-sm p-5 rounded-2xl border border-white/80 shadow-sm">
                    <h3 class="font-bold text-neutral-900 border-b border-neutral-200/60 pb-2">3. Personalización Visual</h3>
                    
                    <div>
                        <label class="block text-xs font-bold text-neutral-500 uppercase tracking-wider mb-2">Color del Plástico</label>
                        <div class="flex flex-wrap gap-3">
                            <button onclick="changeColor('bg-[#Facc15]')" class="color-btn w-10 h-10 rounded-full bg-[#Facc15] border-2 border-black scale-110 shadow-md transition-all"></button>
                            <button onclick="changeColor('bg-[#F87171]')" class="color-btn w-10 h-10 rounded-full bg-[#F87171] border-2 border-transparent opacity-60 transition-all hover:opacity-100"></button>
                            <button onclick="changeColor('bg-[#60A5FA]')" class="color-btn w-10 h-10 rounded-full bg-[#60A5FA] border-2 border-transparent opacity-60 transition-all hover:opacity-100"></button>
                            <button onclick="changeColor('bg-[#262626]')" class="color-btn w-10 h-10 rounded-full bg-[#262626] border-2 border-transparent opacity-60 transition-all hover:opacity-100"></button>
                            <button onclick="changeColor('bg-[#A78BFA]')" class="color-btn w-10 h-10 rounded-full bg-[#A78BFA] border-2 border-transparent opacity-60 transition-all hover:opacity-100"></button>
                            <button onclick="changeColor('bg-[#FFFFFF]')" class="color-btn w-10 h-10 rounded-full bg-[#FFFFFF] border-2 border-transparent opacity-60 transition-all hover:opacity-100 shadow-sm"></button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                        <div>
                            <label class="block text-xs font-bold text-neutral-500 uppercase tracking-wider mb-2">Estilo Etiqueta</label>
                            <select id="labelSelect" onchange="updateStyle()" class="w-full p-3 border border-neutral-300 rounded-xl bg-white/90 outline-none font-medium cursor-pointer">
                                <option value="label-solid">Liso</option>
                                <option value="label-striped">Rayado Vintage</option>
                                <option value="label-grid">Cuadrícula Retro</option>
                                <option value="label-sunset">Degradado Ocaso</option>
                                <option value="label-transparent">Cristal (Glass)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-neutral-500 uppercase tracking-wider mb-2">Tipografía</label>
                            <select id="fontSelect" onchange="updateStyle()" class="w-full p-3 border border-neutral-300 rounded-xl bg-white/90 outline-none font-medium cursor-pointer">
                                <option value="font-handwriting">Marcador</option>
                                <option value="font-typewriter">Máquina de escribir</option>
                                <option value="font-standard">Imprenta</option>
                                <option value="font-cursive">Cursiva Elegante</option>
                                <option value="font-pixel">Retro 8-bit</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button id="submitBtn" onclick="generarMixtape()" class="w-full bg-black text-white font-extrabold text-lg py-4 rounded-xl shadow-[0_4px_14px_0_rgb(0,0,0,0.39)] hover:shadow-[0_6px_20px_rgba(0,0,0,0.23)] hover:-translate-y-1 transition-all">
                    Grabar Mixtape
                </button>
            </div>
        </div>
    </div>

    <!-- LÓGICA DE JAVASCRIPT -->
    <script>
        let currentColor = 'bg-[#Facc15]';
        let songs = []; // Ahora guardará objetos { id: '...', title: '...' }
        const MAX_SONGS = 4;
        
        const webhookUrl = 'https://script.google.com/macros/s/AKfycbzEuISqdSPvb53kM_DZykcWRKVBX7qA4BM6y4lwgosuMZ6IUdhgzB5M86EhlHFdvB23/exec';

        function updatePreview() {
            const titulo = document.getElementById('titulo').value;
            document.getElementById('labelPreview').innerText = titulo || 'Mixtape';
        }

        function updateStyle() {
            const font = document.getElementById('fontSelect').value;
            const label = document.getElementById('labelSelect').value;
            
            const labelEl = document.getElementById('cassetteLabel');
            const textEl = document.getElementById('labelPreview');

            labelEl.className = `absolute top-5 w-[88%] h-[58%] border border-neutral-400/80 rounded shadow-sm flex flex-col items-center justify-start p-2 sm:p-3 z-20 transition-all duration-300 ${label}`;
            textEl.className = `text-neutral-900 text-xl sm:text-2xl leading-tight text-center flex-grow truncate px-2 transition-all ${font}`;
        }

        function changeColor(newColor) {
            const cassette = document.getElementById('cassetteBody');
            cassette.classList.remove(currentColor);
            cassette.classList.add(newColor);
            currentColor = newColor;

            document.querySelectorAll('.color-btn').forEach(btn => {
                if(btn.classList.contains(newColor)) {
                    btn.classList.remove('border-transparent', 'opacity-60');
                    btn.classList.add('border-black', 'scale-110', 'shadow-md');
                } else {
                    btn.classList.add('border-transparent', 'opacity-60');
                    btn.classList.remove('border-black', 'scale-110', 'shadow-md');
                }
            });
        }

        function extractVideoID(url) {
            const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[7].length == 11) ? match[7] : false;
        }

        async function addSong() {
            const input = document.getElementById('songInput');
            const url = input.value.trim();

            if (!url) return;
            if (songs.length >= MAX_SONGS) {
                alert("Solo puedes agregar un máximo de 4 canciones por casete.");
                return;
            }

            const videoId = extractVideoID(url);
            if (!videoId) {
                alert("Por favor, ingresa un enlace válido de YouTube.");
                return;
            }

            // Cambiar el botón a estado de carga
            const btn = document.getElementById('addBtn');
            const originalText = btn.innerText;
            btn.innerText = '⏳';
            btn.disabled = true;
            btn.classList.add('opacity-70');

            let videoTitle = `Pista ${songs.length + 1}`; // Nombre de respaldo

            try {
                // Obtener el título del video de YouTube de forma pública
                const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
                const data = await response.json();
                if (data && data.title) {
                    videoTitle = data.title;
                }
            } catch (error) {
                console.log("No se pudo obtener el título, se usará el nombre por defecto.");
            }

            songs.push({ id: videoId, title: videoTitle });
            input.value = '';
            btn.innerText = originalText;
            btn.disabled = false;
            btn.classList.remove('opacity-70');
            renderSongs();
        }

        function removeSong(index) {
            songs.splice(index, 1);
            renderSongs();
        }

        function renderSongs() {
            const list = document.getElementById('songList');
            const count = document.getElementById('songCount');
            
            list.innerHTML = '';
            count.innerText = `${songs.length}/${MAX_SONGS}`;
            
            if(songs.length === MAX_SONGS) {
                count.classList.add('bg-green-200', 'text-green-800');
            } else {
                count.classList.remove('bg-green-200', 'text-green-800');
            }

            songs.forEach((song, index) => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center bg-white/80 border border-neutral-200 p-3 rounded-xl text-sm shadow-sm animate-fade-in font-medium";
                li.innerHTML = `
                    <span class="truncate flex-grow pr-2 text-neutral-700" title="${song.title}">▶ ${song.title}</span>
                    <button onclick="removeSong(${index})" class="text-red-500 hover:text-red-700 hover:bg-red-50 px-2 py-1 rounded transition font-bold">✕</button>
                `;
                list.appendChild(li);
            });
        }

        document.getElementById('songInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addSong();
        });

        async function generarMixtape() {
            const titulo = document.getElementById('titulo').value;
            const mensaje = document.getElementById('mensaje').value;
            const btn = document.getElementById('submitBtn');
            const font = document.getElementById('fontSelect').value;
            const label = document.getElementById('labelSelect').value;

            if (!titulo) return alert("Por favor, ponle un título a tu mixtape.");
            if (songs.length === 0) return alert("Agrega al menos una canción.");

            btn.innerText = "Grabando cinta...";
            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');

            try {
                const payload = {
                    titulo: titulo,
                    mensaje: mensaje,
                    color: currentColor,
                    canciones: songs, // Se enviarán con id y title
                    estilos: { font: font, label: label }
                };

                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (data.success) {
                    const currentUrl = window.location.href.split('?')[0]; 
                    const finalLink = `${currentUrl}?m=${data.id}`;
                    
                    document.getElementById('linkOutput').value = finalLink;
                    
                    const mainVideo = songs[0].id;
                    const playlist = songs.slice(1).map(s => s.id).join(',');
                    const iframeSrc = `https://www.youtube.com/embed/${mainVideo}?autoplay=0${playlist ? '&playlist=' + playlist : ''}`;
                    document.getElementById('ytIframe').src = iframeSrc;

                    document.getElementById('formZone').classList.add('hidden');
                    document.getElementById('successZone').classList.remove('hidden');
                    
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    alert("Error al guardar. Intenta de nuevo.");
                }
            } catch (error) {
                alert("Error de conexión con Google Sheets.");
            }
            
            btn.innerText = "Grabar Mixtape";
            btn.disabled = false;
            btn.classList.remove('opacity-70', 'cursor-not-allowed');
        }

        function copyLink() {
            const copyText = document.getElementById("linkOutput");
            copyText.select();
            document.execCommand("copy");
            alert("¡Enlace copiado!");
        }

        function resetForm() {
            document.getElementById('titulo').value = '';
            document.getElementById('mensaje').value = '';
            songs = [];
            renderSongs();
            updatePreview();
            document.getElementById('ytIframe').src = "";
            document.getElementById('successZone').classList.add('hidden');
            document.getElementById('formZone').classList.remove('hidden');
        }
    </script>
</body>
</html>
