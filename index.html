<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea tu Mixtape</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <style>
        .spin { animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .font-handwriting { font-family: 'Permanent Marker', cursive; }
        .font-typewriter { font-family: 'Courier Prime', monospace; }
        .font-standard { font-family: 'Inter', sans-serif; }

        .label-solid { background-color: white; }
        .label-striped { background: repeating-linear-gradient(0deg, white, white 19px, #e5e7eb 20px); }
        .label-grid {
            background-color: white;
            background-image: linear-gradient(#e5e7eb 1px, transparent 1px), linear-gradient(90deg, #e5e7eb 1px, transparent 1px);
            background-size: 15px 15px;
        }

        .screw {
            width: 12px; height: 12px;
            background: linear-gradient(135deg, #d1d5db, #9ca3af);
            border-radius: 50%;
            border: 1px solid #4b5563;
            position: absolute;
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.5), inset -1px -1px 2px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center;
        }
        .screw::after { content: ''; width: 8px; height: 1px; background: #374151; transform: rotate(45deg); }

        body {
            background-image: url('assets/textura.jpg');
            background-color: #f3f4f6; 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-6xl w-full bg-white/40 backdrop-blur-md border border-white/50 rounded-3xl shadow-2xl overflow-hidden flex flex-col lg:flex-row min-h-[700px]">
        
        <!-- Panel Izquierdo: Configurador -->
        <div class="w-full lg:w-1/2 p-6 md:p-10 bg-white/60 border-r border-white/40 overflow-y-auto max-h-[90vh] no-scrollbar">
            <h1 class="text-4xl font-extrabold text-neutral-800 mb-2 tracking-tight">Tu Mixtape</h1>
            <p class="text-neutral-600 mb-8 font-medium">Diseña el casete y añade hasta 4 canciones de YouTube.</p>
            
            <!-- Zona de Éxito -->
            <div id="successZone" class="hidden bg-green-50/90 backdrop-blur border border-green-200 rounded-xl p-6 text-center shadow-lg">
                <h3 class="text-green-800 font-bold mb-2 text-lg">¡Cinta grabada con éxito! 📼</h3>
                <p class="text-sm text-green-700 mb-4">Envía este enlace a esa persona especial:</p>
                <input type="text" id="linkOutput" readonly class="w-full border border-green-300 rounded-lg p-3 text-center text-sm mb-4 outline-none bg-white font-medium shadow-inner">
                <button onclick="copyLink()" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition shadow-md">Copiar Enlace</button>
                
                <!-- Reproductor de YouTube Integrado -->
                <div id="playerContainer" class="mt-6 rounded-xl overflow-hidden shadow-lg border border-neutral-200 bg-black">
                    <iframe id="ytIframe" width="100%" height="200" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>

                <button onclick="resetForm()" class="block w-full mt-4 text-sm text-neutral-500 hover:text-neutral-800 underline transition">Crear otra cinta</button>
            </div>

            <!-- Formulario -->
            <div id="formZone" class="space-y-7">
                
                <div class="space-y-4 bg-white/50 p-5 rounded-2xl border border-white/60 shadow-sm">
                    <h3 class="font-bold text-neutral-800 border-b border-neutral-200 pb-2">1. Textos y Dedicatoria</h3>
                    <div>
                        <label class="block text-xs font-bold text-neutral-500 uppercase tracking-wider mb-1">Título de la cinta</label>
                        <input type="text" id="titulo" onkeyup="updatePreview()" placeholder="Ej. Mix para el viaje" class="w-full border border-neutral-300/80 rounded-lg p-3 outline-none focus:ring-2 focus:ring-black bg-white/80 transition" maxlength="30">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-neutral-500 uppercase tracking-wider mb-1">Nota oculta</label>
                        <textarea id="mensaje" placeholder="Escribe un mensaje para cuando abran el casete..." rows="2" class="w-full border border-neutral-300/80 rounded-lg p-3 outline-none focus:ring-2 focus:ring-black bg-white/80 transition resize-none"></textarea>
                    </div>
                </div>

                <div class="space-y-4 bg-white/50 p-5 rounded-2xl border border-white/60 shadow-sm">
                    <div class="flex justify-between items-end border-b border-neutral-200 pb-2">
                        <h3 class="font-bold text-neutral-800">2. Canciones (Máx 4)</h3>
                        <span id="songCount" class="text-xs font-bold bg-neutral-200 px-2 py-1 rounded-full">0/4</span>
                    </div>
                    <div class="flex gap-2">
                        <input type="url" id="songInput" placeholder="Pega el link de YouTube aquí..." class="w-full border border-neutral-300/80 rounded-lg p-3 outline-none focus:ring-2 focus:ring-black bg-white/80 transition">
                        <button onclick="addSong()" class="bg-black text-white px-5 rounded-lg font-bold hover:bg-neutral-800 transition">Add</button>
                    </div>
                    <ul id="songList" class="space-y-2 mt-2">
                        <!-- Las canciones se agregarán aquí -->
                    </ul>
                </div>

                <div class="space-y-4 bg-white/50 p-5 rounded-2xl border border-white/60 shadow-sm">
                    <h3 class="font-bold text-neutral-800 border-b border-neutral-200 pb-2">3. Personalización Visual</h3>
                    
                    <div>
                        <label class="block text-xs font-bold text-neutral-500 uppercase tracking-wider mb-2">Color del Plástico</label>
                        <div class="flex flex-wrap gap-3">
                            <button onclick="changeColor('bg-[#Facc15]')" class="color-btn w-10 h-10 rounded-full bg-[#Facc15] border-2 border-black scale-110 shadow-md transition-all"></button>
                            <button onclick="changeColor('bg-[#F87171]')" class="color-btn w-10 h-10 rounded-full bg-[#F87171] border-2 border-transparent opacity-60 transition-all hover:opacity-100"></button>
                            <button onclick="changeColor('bg-[#60A5FA]')" class="color-btn w-10 h-10 rounded-full bg-[#60A5FA] border-2 border-transparent opacity-60 transition-all hover:opacity-100"></button>
                            <button onclick="changeColor('bg-[#262626]')" class="color-btn w-10 h-10 rounded-full bg-[#262626] border-2 border-transparent opacity-60 transition-all hover:opacity-100"></button>
                            <button onclick="changeColor('bg-[#A78BFA]')" class="color-btn w-10 h-10 rounded-full bg-[#A78BFA] border-2 border-transparent opacity-60 transition-all hover:opacity-100"></button>
                            <button onclick="changeColor('bg-[#F0FDF4]')" class="color-btn w-10 h-10 rounded-full bg-[#F0FDF4] border-2 border-transparent opacity-60 transition-all hover:opacity-100"></button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 pt-2">
                        <div>
                            <label class="block text-xs font-bold text-neutral-500 uppercase tracking-wider mb-2">Estilo Etiqueta</label>
                            <select id="labelSelect" onchange="updateStyle()" class="w-full p-2 border border-neutral-300 rounded-lg bg-white/80 outline-none">
                                <option value="label-solid">Liso</option>
                                <option value="label-striped">Rayado Vintage</option>
                                <option value="label-grid">Cuadrícula Retro</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-neutral-500 uppercase tracking-wider mb-2">Tipografía</label>
                            <select id="fontSelect" onchange="updateStyle()" class="w-full p-2 border border-neutral-300 rounded-lg bg-white/80 outline-none">
                                <option value="font-handwriting">Marcador (Manual)</option>
                                <option value="font-typewriter">Máquina de escribir</option>
                                <option value="font-standard">Imprenta</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button id="submitBtn" onclick="generarMixtape()" class="w-full bg-black text-white font-extrabold text-lg py-4 rounded-xl shadow-[0_4px_14px_0_rgb(0,0,0,0.39)] hover:shadow-[0_6px_20px_rgba(0,0,0,0.23)] hover:-translate-y-1 transition-all">
                    Grabar Mixtape
                </button>
            </div>
        </div>

        <!-- Panel Derecho: Previsualización Realista -->
        <div class="w-full lg:w-1/2 p-8 flex flex-col items-center justify-center relative min-h-[400px]">
            <div class="z-10 text-center w-full max-w-[400px]">
                
                <!-- CASETE REALISTA -->
                <div id="cassetteBody" class="w-full aspect-[16/10] bg-[#Facc15] rounded-lg border-2 border-neutral-800 shadow-[inset_0px_0px_20px_rgba(0,0,0,0.3),_10px_15px_25px_rgba(0,0,0,0.4)] flex items-center justify-center relative overflow-hidden transition-colors duration-500">
                    
                    <div class="screw top-2 left-2"></div>
                    <div class="screw top-2 right-2"></div>
                    <div class="screw bottom-2 left-2"></div>
                    <div class="screw bottom-2 right-2"></div>
                    
                    <div class="absolute inset-2 border-2 border-black/10 rounded-md pointer-events-none"></div>

                    <div id="cassetteLabel" class="absolute top-4 w-11/12 h-3/5 label-solid border border-neutral-400 rounded-sm shadow-sm flex flex-col items-center justify-start p-2 z-20">
                        <div class="w-full border-b-2 border-red-500 pb-1 mb-1 flex justify-between items-center px-1">
                            <span class="text-[10px] font-bold text-neutral-500">60 MIN</span>
                            <span id="labelPreview" class="font-handwriting text-black text-lg sm:text-xl leading-tight text-center flex-grow truncate px-2">Mixtape</span>
                            <span class="text-[10px] font-bold text-neutral-500">LADO A</span>
                        </div>
                    </div>
                    
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-4/5 h-20 bg-black/10 rounded-lg border border-black/20 z-30 flex items-center justify-between px-6 shadow-inner">
                        
                        <!-- Engranaje Izquierdo Corregido (SVG en línea seguro) -->
                        <div class="w-12 h-12 rounded-full border-[5px] border-neutral-800 bg-[#f8f9fa] flex items-center justify-center relative shadow-[inset_0_2px_4px_rgba(0,0,0,0.3)]">
                            <svg class="absolute w-full h-full spin text-neutral-800 opacity-80" viewBox="0 0 100 100" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                <path d="M50 10 L60 40 L90 50 L60 60 L50 90 L40 60 L10 50 L40 40 Z"/>
                            </svg>
                            <div class="w-3 h-3 bg-neutral-800 rounded-full z-10"></div>
                        </div>
                        
                        <div class="w-32 h-10 bg-neutral-900 rounded-md flex items-center justify-center shadow-inner relative overflow-hidden border border-neutral-700">
                            <div class="absolute left-[-20px] w-20 h-20 bg-neutral-800 rounded-full"></div>
                            <div class="absolute right-[-20px] w-16 h-16 bg-neutral-800 rounded-full"></div>
                            <div class="w-24 h-[2px] bg-neutral-500/50 rounded z-10"></div>
                        </div>
                        
                        <!-- Engranaje Derecho Corregido (SVG en línea seguro) -->
                        <div class="w-12 h-12 rounded-full border-[5px] border-neutral-800 bg-[#f8f9fa] flex items-center justify-center relative shadow-[inset_0_2px_4px_rgba(0,0,0,0.3)]">
                            <svg class="absolute w-full h-full spin text-neutral-800 opacity-80" viewBox="0 0 100 100" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                <path d="M50 10 L60 40 L90 50 L60 60 L50 90 L40 60 L10 50 L40 40 Z"/>
                            </svg>
                            <div class="w-3 h-3 bg-neutral-800 rounded-full z-10"></div>
                        </div>
                    </div>

                    <div class="absolute bottom-0 w-3/4 h-10 border-t-2 border-black/20 flex justify-around items-end pb-1 opacity-60">
                        <div class="w-4 h-4 bg-black/20 rounded-full"></div>
                        <div class="w-4 h-4 bg-black/20 rounded-full"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- LÓGICA DE JAVASCRIPT -->
    <script>
        let currentColor = 'bg-[#Facc15]';
        let songs = [];
        const MAX_SONGS = 4;
        
        // TU WEBHOOK
        const webhookUrl = 'https://script.google.com/macros/s/AKfycbzEuISqdSPvb53kM_DZykcWRKVBX7qA4BM6y4lwgosuMZ6IUdhgzB5M86EhlHFdvB23/exec';

        function updatePreview() {
            const titulo = document.getElementById('titulo').value;
            document.getElementById('labelPreview').innerText = titulo || 'Mixtape';
        }

        function updateStyle() {
            const font = document.getElementById('fontSelect').value;
            const label = document.getElementById('labelSelect').value;
            
            const labelEl = document.getElementById('cassetteLabel');
            const textEl = document.getElementById('labelPreview');

            labelEl.className = `absolute top-4 w-11/12 h-3/5 border border-neutral-400 rounded-sm shadow-sm flex flex-col items-center justify-start p-2 z-20 ${label}`;
            textEl.className = `text-black text-lg sm:text-xl leading-tight text-center flex-grow truncate px-2 ${font}`;
        }

        function changeColor(newColor) {
            const cassette = document.getElementById('cassetteBody');
            cassette.classList.remove(currentColor);
            cassette.classList.add(newColor);
            currentColor = newColor;

            document.querySelectorAll('.color-btn').forEach(btn => {
                if(btn.classList.contains(newColor)) {
                    btn.classList.remove('border-transparent', 'opacity-60');
                    btn.classList.add('border-black', 'scale-110', 'shadow-md');
                } else {
                    btn.classList.add('border-transparent', 'opacity-60');
                    btn.classList.remove('border-black', 'scale-110', 'shadow-md');
                }
            });
        }

        // Extraer ID de YouTube
        function extractVideoID(url) {
            const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[7].length == 11) ? match[7] : false;
        }

        function addSong() {
            const input = document.getElementById('songInput');
            const url = input.value.trim();

            if (!url) return;
            if (songs.length >= MAX_SONGS) {
                alert("Solo puedes agregar un máximo de 4 canciones por casete.");
                return;
            }

            const videoId = extractVideoID(url);
            if (!videoId) {
                alert("Por favor, ingresa un enlace válido de YouTube.");
                return;
            }

            songs.push(videoId);
            input.value = '';
            renderSongs();
        }

        function removeSong(index) {
            songs.splice(index, 1);
            renderSongs();
        }

        function renderSongs() {
            const list = document.getElementById('songList');
            const count = document.getElementById('songCount');
            
            list.innerHTML = '';
            count.innerText = `${songs.length}/${MAX_SONGS}`;
            
            if(songs.length === MAX_SONGS) {
                count.classList.add('bg-green-200', 'text-green-800');
            } else {
                count.classList.remove('bg-green-200', 'text-green-800');
            }

            songs.forEach((songId, index) => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center bg-white border border-neutral-200 p-2 rounded-lg text-sm shadow-sm animate-fade-in";
                li.innerHTML = `
                    <span class="truncate flex-grow pr-2 font-medium text-neutral-700">▶ Track ${index + 1} (Agregada)</span>
                    <button onclick="removeSong(${index})" class="text-red-500 hover:text-red-700 hover:bg-red-50 p-1 rounded transition">✕</button>
                `;
                list.appendChild(li);
            });
        }

        document.getElementById('songInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addSong();
        });

        async function generarMixtape() {
            const titulo = document.getElementById('titulo').value;
            const mensaje = document.getElementById('mensaje').value;
            const btn = document.getElementById('submitBtn');
            const font = document.getElementById('fontSelect').value;
            const label = document.getElementById('labelSelect').value;

            if (!titulo) return alert("Por favor, ponle un título a tu mixtape.");
            if (songs.length === 0) return alert("Agrega al menos una canción.");

            btn.innerText = "Grabando cinta...";
            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');

            try {
                const payload = {
                    titulo: titulo,
                    mensaje: mensaje,
                    color: currentColor,
                    canciones: songs,
                    estilos: { font: font, label: label }
                };

                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (data.success) {
                    const currentUrl = window.location.href.split('?')[0]; 
                    const finalLink = `${currentUrl}?m=${data.id}`;
                    
                    document.getElementById('linkOutput').value = finalLink;
                    
                    // Configurar y cargar el reproductor de YouTube
                    const mainVideo = songs[0];
                    const playlist = songs.slice(1).join(',');
                    const iframeSrc = `https://www.youtube.com/embed/${mainVideo}?autoplay=0${playlist ? '&playlist=' + playlist : ''}`;
                    document.getElementById('ytIframe').src = iframeSrc;

                    document.getElementById('formZone').classList.add('hidden');
                    document.getElementById('successZone').classList.remove('hidden');
                } else {
                    alert("Error al guardar. Intenta de nuevo.");
                }
            } catch (error) {
                alert("Error de conexión con Google Sheets.");
            }
            
            btn.innerText = "Grabar Mixtape";
            btn.disabled = false;
            btn.classList.remove('opacity-70', 'cursor-not-allowed');
        }

        function copyLink() {
            const copyText = document.getElementById("linkOutput");
            copyText.select();
            document.execCommand("copy");
            alert("¡Enlace copiado!");
        }

        function resetForm() {
            document.getElementById('titulo').value = '';
            document.getElementById('mensaje').value = '';
            songs = [];
            renderSongs();
            updatePreview();
            document.getElementById('ytIframe').src = "";
            document.getElementById('successZone').classList.add('hidden');
            document.getElementById('formZone').classList.remove('hidden');
        }
    </script>
</body>
</html>
